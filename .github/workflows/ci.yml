name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: architect_test
          POSTGRES_USER: architect
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architect -d architect_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://architect:test_only_password@localhost:5432/architect_test
      TEST_DATABASE_URL: postgresql+psycopg://architect:test_only_password@localhost:5432/architect_test
      CORS_ORIGINS: http://localhost:5173
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check backend
      - run: ruff format --check backend
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      # This database belongs only to this disposable CI job.
      - run: alembic -c backend/alembic.ini downgrade base
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify services and runtime users
        run: |
          docker compose exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          curl --fail http://localhost:8000/health/ready
          curl --fail http://localhost:5173/
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
      - name: Verify restart recovery
        run: |
          docker compose restart db
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/health/ready
          docker compose restart api frontend
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/health/ready
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:5173/
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Remove disposable CI services
        if: always()
        run: docker compose down --volumes
