[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-architect-backend"
version = "0.1.0"
description = "API foundation for AI Project Architect"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["architect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running migrated PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
